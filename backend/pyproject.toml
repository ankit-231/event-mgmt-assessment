[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "Ankit Khanal", email = "ankitkhanal231@gmail.com" }]

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (==5.2.*)",
    "python-decouple (>=3.8,<4.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-currentuser (>=0.10.0,<0.11.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
]

[dependency-groups]
dev = ["django-extensions (>=4.1,<5.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
